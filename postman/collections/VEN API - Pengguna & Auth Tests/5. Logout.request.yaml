$kind: http-request
url: "{{base_url}}/api/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Token cleared from environment", function () {
          pm.environment.unset("auth_token");
      });
    language: text/javascript
order: 5000
