$kind: http-request
description: Pendaftaran pengguna baru yang memicu Hash::make() dengan algoritma Bcrypt dan salt unik.
url: "{{base_url}}/api/auth/daftar"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "nama": "Auditor Hash",
        "nama_panggilan": "audit_{{$timestamp}}",
        "email": "audit_{{$timestamp}}@ven.test",
        "kata_sandi": "PasswordAman123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Registrasi merespons sukses atau validasi OTP", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 422]);
      });
    language: text/javascript
order: 1000
