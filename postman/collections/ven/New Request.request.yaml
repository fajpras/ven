{
	"info": {
		"_postman_id": "b1a2c3d4-e5f6-7890-abcd-ef1234567890",
		"name": "VEN API - Pengguna & Auth Tests",
		"description": "Koleksi pengujian Postman untuk modul Pengguna dan Autentikasi API ven_null.",
		"schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
	},
	"event": [
		{
			"listen": "prerequest",
			"script": {
				"type": "text/javascript",
				"exec": [
					"pm.request.headers.add({key: 'Accept', value: 'application/json'});"
				]
			}
		}
	],
	"item": [
		{
			"name": "1. Login (Sukses)",
			"event": [
				{
					"listen": "test",
					"script": {
						"exec": [
							"pm.test(\"Status code is 200 OK\", function () {",
							"    pm.response.to.have.status(200);",
							"});",
							"",
							"pm.test(\"Response contains Sanctum token and user data\", function () {",
							"    const jsonData = pm.response.json();",
							"    pm.expect(jsonData).to.have.property('token');",
							"    pm.expect(jsonData.data).to.have.property('id_pengguna');",
							"    pm.expect(jsonData.data.status).to.eql('aktif');",
							"",
							"    // Simpan token & user_id ke environment variable",
							"    pm.environment.set(\"auth_token\", jsonData.token);",
							"    pm.environment.set(\"user_id\", jsonData.data.id_pengguna);",
							"});"
						],
						"type": "text/javascript"
					}
				}
			],
			"request": {
				"method": "POST",
				"header": [
					{
						"key": "Content-Type",
						"value": "application/json"
					}
				],
				"body": {
					"mode": "raw",
					"raw": "{\n    \"email\": \"fajri@ven.test\",\n    \"kata_sandi\": \"password123\"\n}"
				},
				"url": {
					"raw": "{{base_url}}/api/login",
					"host": [
						"{{base_url}}"
					],
					"path": [
						"api",
						"login"
					]
				}
			}
		},
		{
			"name": "2. Login (Cek Sanksi Akun)",
			"event": [
				{
					"listen": "test",
					"script": {
						"exec": [
							"pm.test(\"Status code is 401 Unauthorized or 403 Forbidden\", function () {",
							"    pm.expect(pm.response.code).to.be.oneOf([401, 403]);",
							"});",
							"",
							"pm.test(\"Response returns sanksi reason message\", function () {",
							"    const jsonData = pm.response.json();",
							"    pm.expect(jsonData).to.have.property('message');",
							"    pm.expect(jsonData.message).to.include('Akun Anda dikenai sanksi');",
							"});"
						],
						"type": "text/javascript"
					}
				}
			],
			"request": {
				"method": "POST",
				"header": [
					{
						"key": "Content-Type",
						"value": "application/json"
					}
				],
				"body": {
					"mode": "raw",
					"raw": "{\n    \"email\": \"suspended@ven.test\",\n    \"kata_sandi\": \"password123\"\n}"
				},
				"url": {
					"raw": "{{base_url}}/api/login",
					"host": [
						"{{base_url}}"
					],
					"path": [
						"api",
						"login"
					]
				}
			}
		},
		{
			"name": "3. Get Profil Pengguna (/me)",
			"event": [
				{
					"listen": "test",
					"script": {
						"exec": [
							"pm.test(\"Status code is 200 OK\", function () {",
							"    pm.response.to.have.status(200);",
							"});",
							"",
							"pm.test(\"Response returns valid UUID and Pengguna structure\", function () {",
							"    const jsonData = pm.response.json();",
							"    const data = jsonData.data || jsonData;",
							"    const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;",
							"    ",
							"    pm.expect(data.id_pengguna).to.match(uuidRegex);",
							"    pm.expect(data).to.have.property('nama');",
							"    pm.expect(data).to.have.property('email');",
							"    pm.expect(data).to.not.have.property('kata_sandi');",
							"    pm.expect(data).to.not.have.property('google_id');",
							"});"
						],
						"type": "text/javascript"
					}
				}
			],
			"request": {
				"auth": {
					"type": "bearer",
					"bearer": [
						{
							"key": "token",
							"value": "{{auth_token}}",
							"type": "string"
						}
					]
				},
				"method": "GET",
				"header": [],
				"url": {
					"raw": "{{base_url}}/api/me",
					"host": [
						"{{base_url}}"
					],
					"path": [
						"api",
						"me"
					]
				}
			}
		},
		{
			"name": "4. Update Profil Pengguna",
			"event": [
				{
					"listen": "test",
					"script": {
						"exec": [
							"pm.test(\"Status code is 200 OK\", function () {",
							"    pm.response.to.have.status(200);",
							"});",
							"",
							"pm.test(\"Data updated successfully\", function () {",
							"    const jsonData = pm.response.json();",
							"    const reqBody = JSON.parse(pm.request.body.raw);",
							"    const data = jsonData.data || jsonData;",
							"    ",
							"    pm.expect(data.nama_panggilan).to.eql(reqBody.nama_panggilan);",
							"    pm.expect(data.deskripsi).to.eql(reqBody.deskripsi);",
							"});"
						],
						"type": "text/javascript"
					}
				}
			],
			"request": {
				"auth": {
					"type": "bearer",
					"bearer": [
						{
							"key": "token",
							"value": "{{auth_token}}",
							"type": "string"
						}
					]
				},
				"method": "PUT",
				"header": [
					{
						"key": "Content-Type",
						"value": "application/json"
					}
				],
				"body": {
					"mode": "raw",
					"raw": "{\n    \"nama_panggilan\": \"fajrinur_dev\",\n    \"deskripsi\": \"Fullstack Developer & 3D Web Enthusiast di VEN Platform.\"\n}"
				},
				"url": {
					"raw": "{{base_url}}/api/pengguna/update",
					"host": [
						"{{base_url}}"
					],
					"path": [
						"api",
						"pengguna",
						"update"
					]
				}
			}
		},
		{
			"name": "5. Logout",
			"event": [
				{
					"listen": "test",
					"script": {
						"exec": [
							"pm.test(\"Status code is 200 OK\", function () {",
							"    pm.response.to.have.status(200);",
							"});",
							"",
							"pm.test(\"Token cleared from environment\", function () {",
							"    pm.environment.unset(\"auth_token\");",
							"});"
						],
						"type": "text/javascript"
					}
				}
			],
			"request": {
				"auth": {
					"type": "bearer",
					"bearer": [
						{
							"key": "token",
							"value": "{{auth_token}}",
							"type": "string"
						}
					]
				},
				"method": "POST",
				"header": [],
				"url": {
					"raw": "{{base_url}}/api/logout",
					"host": [
						"{{base_url}}"
					],
					"path": [
						"api",
						"logout"
					]
				}
			}
		}
	]
}