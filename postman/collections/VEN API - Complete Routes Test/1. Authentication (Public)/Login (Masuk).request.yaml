$kind: http-request
url: "{{base_url}}/api/auth/masuk"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "identitas": "fajri@ven.test",
        "kata_sandi": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login berhasil & simpan token", function () {
          pm.response.to.have.status(200);
          const jsonData = pm.response.json();
          if (jsonData.token) {
              pm.environment.set("auth_token", jsonData.token);
          }
      });
    language: text/javascript
order: 3000
