$kind: http-request
name: Tambah Karya (Multipart / Form-Data)
url: "{{base_url}}/api/karya"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: id_kategori
      value: "1"
    - type: text
      key: judul
      value: Seni Poster 3D
    - type: text
      key: jenis
      value: poster
    - type: text
      key: deskripsi
      value: Karya poster interaktif pameran.
    - type: file
      key: file
      src:
        - ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 3000
